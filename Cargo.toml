[package]
name = "su03t-update"
version = "0.5.2"
edition = "2024"
description = "SU-03T firmware transfer and serial diagnostics for macOS and Linux"
license = "MIT"
repository = "https://github.com/MatriQ/su03t-macos"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4.8"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = { version = "1", optional = true, default-features = false }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:plist"]

[dev-dependencies]
libc = "0.2"
tempfile = "3"

# macOS 27 rejects some LLVM-stripped proc-macro dylibs (rust-lang/rust#157750).
# Keep debug info in build-time tools; the shipped release binary is unaffected.
[profile.release.build-override]
debug = true
strip = "none"
