[package]
name = "su03t-update"
version = "0.6.1"
edition = "2024"
description = "SU-03T firmware transfer and serial diagnostics for macOS, Linux and Windows"
license = "MIT"
repository = "https://github.com/MatriQ/su03t-tools"
readme = "README.md"
default-run = "su03t-update"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4.8"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "accesskit"] }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = { version = "1", optional = true, default-features = false }
cpal = { version = "0.18.2", optional = true }
hound = "3.5.1"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:plist", "dep:wgpu", "dep:cpal"]
windows-launcher = ["gui"]

[[bin]]
name = "su03t-tools"
path = "src/windows_launcher.rs"
required-features = ["windows-launcher"]

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "27", optional = true, default-features = false, features = ["dx12", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

# macOS 27 rejects some LLVM-stripped proc-macro dylibs (rust-lang/rust#157750).
# Keep debug info in build-time tools; the shipped release binary is unaffected.
[profile.release.build-override]
debug = true
strip = "none"
