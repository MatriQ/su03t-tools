name: client checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev
      - if: runner.os != 'Windows'
        run: python3 tests/test_installer.py
      - run: python3 tests/test_release_assets.py
      - run: cargo fmt --all --check
      - run: cargo test --locked
        timeout-minutes: 15
      - run: cargo test --locked --no-default-features
        timeout-minutes: 5
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - if: runner.os != 'Windows'
        run: python3 tests/client_acceptance.py target/debug/su03t-update
      - if: runner.os != 'Windows'
        run: python3 tests/transfer_events.py target/debug/su03t-update
      - if: runner.os == 'Windows'
        run: |
          cargo build --locked --features windows-launcher
          if ($LASTEXITCODE) { throw 'Windows launcher build failed.' }
          python3 tests/cli_smoke.py target/debug/su03t-update.exe
      - if: runner.os == 'Windows'
        name: Test the Windows installer with PowerShell 7
        shell: pwsh
        run: ./tests/test_windows_installer.ps1 -BinaryDirectory target/debug
      - if: runner.os == 'Windows'
        name: Test the Windows installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test_windows_installer.ps1 -BinaryDirectory target/debug
      - if: runner.os == 'macOS'
        run: python3 tests/simulate_device.py target/debug/su03t-update
