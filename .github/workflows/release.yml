name: packages and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to publish; leave empty for a build only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: packages-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      released: ${{ steps.meta.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release state
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/release_assets.py metadata --tag "$RELEASE_TAG" --check-release >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release_assets.py metadata >> "$GITHUB_OUTPUT"
          fi
  quality:
    if: >-
      needs.metadata.outputs.released != 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '') || github.event_name == 'release')
    needs: metadata
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  package:
    if: needs.metadata.outputs.released != 'true'
    needs: metadata
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-universal
          - os: ubuntu-24.04
            platform: Linux-x86_64
          - os: ubuntu-24.04-arm
            platform: Linux-aarch64
          - os: windows-2022
            platform: Windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: rust-docs
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: packages-${{ runner.os }}-${{ runner.arch }}-rust195-${{ hashFiles('Cargo.lock') }}
          restore-keys: packages-${{ runner.os }}-${{ runner.arch }}-rust195-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev xvfb xauth fonts-noto-cjk libgl1-mesa-dri
      - if: runner.os != 'Windows'
        name: Test installer and release helpers
        run: |
          bash -n install.sh
          python3 tests/test_installer.py
          python3 tests/test_release_assets.py
      - if: runner.os == 'Windows'
        run: python3 tests/test_release_assets.py
      - if: runner.os == 'macOS'
        name: Package the universal Mac app
        run: bash scripts/package-macos.sh --universal
      - if: runner.os == 'Linux'
        name: Package the native Linux app
        run: bash scripts/package-linux.sh
      - if: runner.os == 'Windows'
        name: Package the Windows desktop and CLI
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - if: runner.os != 'Windows'
        name: Verify the packaged executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir archive-smoke
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "dist/SU03T-Tools-v$RELEASE_VERSION-macOS-universal.zip" archive-smoke
            BINARY="$PWD/archive-smoke/SU03T Update.app/Contents/MacOS/su03t-update"
            ARCHITECTURES=" $(lipo -archs "$BINARY") "
            for ARCHITECTURE in arm64 x86_64; do
              case "$ARCHITECTURES" in
                *" $ARCHITECTURE "*) ;;
                *) printf 'Missing universal slice: %s\n' "$ARCHITECTURE" >&2; exit 1 ;;
              esac
            done
            codesign --verify --deep --strict 'archive-smoke/SU03T Update.app'
          else
            tar -xzf "dist/SU03T-Tools-v$RELEASE_VERSION-$PACKAGE_PLATFORM.tar.gz" -C archive-smoke
            BINARY="$PWD/archive-smoke/su03t-update"
            test -s archive-smoke/.harness/docs/protocol.md
            test -s archive-smoke/.harness/docs/validation.md
          fi
          test "$("$BINARY" --version)" = "su03t-update $RELEASE_VERSION"
          python3 tests/client_acceptance.py "$BINARY"
          python3 tests/transfer_events.py "$BINARY"
          if [ "$RUNNER_OS" = macOS ]; then
            python3 tests/simulate_device.py "$BINARY"
            python3 tests/handshake_diagnostics.py "$BINARY"
            ARCHIVE="dist/SU03T-Tools-v$RELEASE_VERSION-$PACKAGE_PLATFORM.zip"
          else
            ARCHIVE="dist/SU03T-Tools-v$RELEASE_VERSION-$PACKAGE_PLATFORM.tar.gz"
            set +e
            LIBGL_ALWAYS_SOFTWARE=1 timeout 8s xvfb-run -a "$BINARY" > /tmp/su03t-gui-smoke.log 2>&1
            GUI_STATUS=$?
            set -e
            if [ "$GUI_STATUS" != 124 ]; then
              cat /tmp/su03t-gui-smoke.log
              exit 1
            fi
          fi
          python3 tests/install_package.py --archive "$ARCHIVE" --version "$RELEASE_VERSION" --platform "$PACKAGE_PLATFORM"
      - if: runner.os == 'Windows'
        name: Verify the Windows package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          Expand-Archive "dist/SU03T-Tools-v$env:RELEASE_VERSION-Windows-x86_64.zip" archive-smoke
          $Reported = & ./archive-smoke/su03t-update.exe --version
          if ($LASTEXITCODE -or $Reported -ne "su03t-update $env:RELEASE_VERSION") { throw 'Packaged version mismatch.' }
          python3 tests/cli_smoke.py archive-smoke/su03t-update.exe
          if ($LASTEXITCODE) { throw 'Packaged CLI checks failed.' }
          ./tests/test_windows_installer.ps1 -BinaryDirectory archive-smoke
          ./tests/windows_gui_smoke.ps1 -Directory archive-smoke -ResizeDisplay
      - if: always() && runner.os == 'Windows'
        name: Retain Windows GUI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui
          path: .harness/local-evidence/windows-ui/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload package and platform checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/SU03T-Tools-v${{ needs.metadata.outputs.version }}-${{ matrix.platform }}.*
            dist/SU03T-Tools-v${{ needs.metadata.outputs.version }}-SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  publish:
    if: >-
      !cancelled() && needs.metadata.result == 'success' &&
      needs.metadata.outputs.released != 'true' &&
      needs.quality.result == 'success' && needs.package.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '') || github.event_name == 'release')
    needs: [metadata, quality, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Verify all packages and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          for ATTEMPT in 1 2 3 4; do
            if python3 scripts/release_assets.py publish --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --directory release-assets; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 4 ]; then
              printf 'Publication attempt %s failed; retrying in 20 seconds.\n' "$ATTEMPT" >&2
              sleep 20
            fi
          done
          exit 1
